name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"
          cache: pnpm
      - run: uv sync --frozen --all-packages --all-groups
      - run: pnpm install --frozen-lockfile
      - run: make verify
      - run: pnpm --filter @mvp-master/web build

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"
          cache: pnpm
      - run: uv sync --frozen --all-packages --all-groups
      - run: pnpm install --frozen-lockfile
      - run: make security

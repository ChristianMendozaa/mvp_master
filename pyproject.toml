[project]
name = "mvp-master-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/python_common",
  "packages/python_observability",
  "services/control_plane",
  "services/integrations",
  "services/delivery",
  "runners/docker_runner",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25.0,<5",
  "mypy>=1.17.0,<2",
  "pip-audit>=2.9.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.0,<7",
  "ruff>=0.12.0,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S107"]
"**/seed.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker.*", "nats.*", "minio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["packages", "services", "runners", "tests"]
markers = ["integration: requires infrastructure"]

[project]
name = "mvp-docker-runner"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "claude-agent-sdk>=0.2.100,<0.3",
  "docker>=7.1.0,<8",
  "httpx>=0.28.0,<1",
  "mvp-common",
  "pydantic-settings>=2.10.0,<3",
]

[tool.uv.sources]
mvp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_runner"]

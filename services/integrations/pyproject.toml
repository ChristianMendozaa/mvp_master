[project]
name = "mvp-integrations"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16.0,<2",
  "asyncpg>=0.30.0,<1",
  "cryptography>=45.0.0,<47",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "mvp-common",
  "mvp-observability",
  "nats-py>=2.11.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "pyjwt[crypto]>=2.10.0,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[tool.uv.sources]
mvp-common = { workspace = true }
mvp-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_integrations"]

[project]
name = "mvp-observability"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116.0,<1",
  "opentelemetry-api>=1.36.0,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
  "opentelemetry-sdk>=1.36.0,<2",
  "sqlalchemy[asyncio]>=2.0.40,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_observability"]

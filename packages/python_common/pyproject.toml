[project]
name = "mvp-common"
version = "0.1.0"
description = "Universal contracts and infrastructure-neutral primitives for MVP Master"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_common"]
